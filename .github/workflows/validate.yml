name: validate
on:
  push:
  pull_request:
jobs:
  v01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run generate:controlled-thin-film-reference
      - run: npm run experiment:controlled-thin-film
      - run: git diff --exit-code -- experiments/controlled-thin-film
      - run: npm run test:validate-read-only
